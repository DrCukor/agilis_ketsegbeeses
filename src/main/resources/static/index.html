<!DOCTYPE html>
<html lang="hu" class="auth-pending">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KözösKassza</title>
    <!-- Téma (világos/sötét) beállítása a kirajzolás előtt -->
    <script src="theme.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind Konfiguráció a betűtípushoz -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#4f46e5', // Indigo 600
                        primaryHover: '#4338ca', // Indigo 700
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="theme.css">
    <!-- Közös segédfüggvények (formázás, pénznemek, kategóriák, értesítések, munkamenet, csoportok) -->
    <script src="common.js"></script>
    <style>
        /* Egyedi fókusz stílusok az inputokhoz (React-szerű érzet) */
        input:focus, select:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Közös fejléc (common.js renderHeader) -->
    <header id="appHeader"></header>

    <main class="flex-grow max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <!--
          Reszponzív Grid:
          - Mobilon 1 oszlop (egymás alatt)
          - Nagy kijelzőn 3:2 (lg), illetve 2:1 (xl) arányban: balra az űrlap és az egyenlegek, jobbra a listák
        -->
        <div class="grid grid-cols-1 lg:grid-cols-5 xl:grid-cols-3 gap-6 xl:gap-8">

            <!-- Bal oldali oszlop: Új kiadás és Egyenlegek -->
            <div class="lg:col-span-3 xl:col-span-2 flex flex-col gap-6 xl:gap-8 min-w-0">

                <section id="expenseFormSection" class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="px-6 py-5 border-b border-slate-100 bg-slate-50/50">
                        <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                            <span id="expenseFormTitle">Új kiadás hozzáadása</span>
                        </h2>
                    </div>

                    <form id="expenseForm" class="p-6 flex flex-col gap-5" novalidate>
                        <!-- Megnevezés -->
                        <div class="flex flex-col gap-1.5">
                            <label for="title" class="text-sm font-medium text-slate-700">Megnevezés</label>
                            <input type="text" id="title" maxlength="100" placeholder="pl. Heti bevásárlás, Vonatjegy..." class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm transition-all duration-200">
                        </div>

                        <div class="flex flex-col sm:flex-row gap-5">
                            <!-- Összeg és pénznem -->
                            <div class="flex-1 flex flex-col gap-1.5">
                                <label for="amount" class="text-sm font-medium text-slate-700">Összeg</label>
                                <div class="flex gap-2">
                                    <input type="number" id="amount" placeholder="0" min="0" step="any" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm transition-all duration-200 text-right font-medium">
                                    <select id="currency" aria-label="Pénznem" class="w-28 flex-shrink-0 rounded-lg border border-slate-300 px-3 py-2.5 text-sm font-medium transition-all duration-200 bg-white"></select>
                                </div>
                            </div>

                            <!-- Ki fizette (csak a csoport tulajdonosának / adminnak; mindenki más a saját nevében rögzít) -->
                            <div id="payerField" class="hidden flex-1 flex-col gap-1.5">
                                <label for="payer" class="text-sm font-medium text-slate-700">Ki fizette?</label>
                                <select id="payer" class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm transition-all duration-200 bg-white"></select>
                            </div>
                        </div>

                        <!-- Kategória -->
                        <div class="flex flex-col gap-1.5">
                            <span class="text-sm font-medium text-slate-700">Kategória</span>
                            <div id="categoryChips" class="flex flex-wrap gap-2" role="radiogroup" aria-label="Kategória"></div>
                        </div>

                        <!-- Résztvevők és megosztás -->
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 flex flex-col gap-4">
                            <div class="flex items-center justify-between">
                                <span class="text-sm text-slate-600 font-medium">Kik között oszlik meg?</span>
                                <button type="button" id="selectAllParticipantsBtn" class="text-sm text-primary font-semibold hover:underline">Mindenki</button>
                            </div>
                            <div id="participantChips" class="flex flex-wrap gap-2"></div>

                            <!-- Megosztási mód -->
                            <div class="flex flex-col gap-1.5">
                                <span class="text-xs font-semibold uppercase tracking-wide text-slate-500">Megosztás módja</span>
                                <div id="splitModeButtons" class="grid grid-cols-2 sm:grid-cols-4 gap-1 bg-white border border-slate-200 rounded-xl p-1" role="radiogroup" aria-label="Megosztás módja"></div>
                            </div>

                            <!-- Résztvevőnkénti csúszkák (nem egyenlő megosztásnál) -->
                            <div id="splitRows" class="hidden flex-col gap-3"></div>

                            <p id="splitSummary" class="text-xs font-medium text-slate-500"></p>
                        </div>

                        <!-- Havonta ismétlődő kiadás (csak új kiadásnál) -->
                        <div id="recurringField" class="flex flex-col gap-2">
                            <label class="flex items-center gap-2 text-sm font-medium text-slate-700 cursor-pointer w-fit">
                                <input type="checkbox" id="recurringCheckbox" class="w-4 h-4 accent-indigo-600">
                                🔁 Havonta ismétlődik
                            </label>
                            <div id="recurringOptions" class="hidden items-center gap-2 text-sm text-slate-600 pl-6">
                                <span>Minden hónap</span>
                                <select id="recurringDay" class="rounded-lg border border-slate-300 px-2 py-1.5 text-sm bg-white"></select>
                                <span>napján. Az első kiadás most jön létre.</span>
                            </div>
                        </div>

                        <!-- Űrlap hibaüzenet -->
                        <div id="expenseFormError" role="alert" class="hidden rounded-xl border border-rose-100 bg-rose-50 px-4 py-3 text-sm font-medium text-rose-700"></div>

                        <!-- Gombok -->
                        <div class="mt-2 flex flex-col sm:flex-row gap-3">
                            <button type="button" id="cancelEditBtn" class="hidden sm:w-40 border border-slate-300 text-slate-600 hover:text-slate-800 hover:bg-slate-100 font-medium rounded-xl py-3 transition-all duration-200">
                                Mégse
                            </button>
                            <button type="submit" id="submitExpenseBtn" class="flex-1 bg-primary hover:bg-primaryHover disabled:opacity-70 disabled:cursor-not-allowed text-white font-medium rounded-xl py-3 shadow-sm transition-all duration-200 flex items-center justify-center gap-2">
                                <span id="submitExpenseLabel">Kiadás mentése</span>
                                <svg id="submitExpenseIcon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                                <svg id="submitExpenseSpinner" xmlns="http://www.w3.org/2000/svg" class="hidden h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity="0.25"/><path d="M22 12a10 10 0 0 0-10-10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
                            </button>
                        </div>
                    </form>
                </section>

                <section class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="px-6 py-5 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                        <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-rose-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
                            Egyenlegek
                        </h2>
                        <!-- Csak akkor zöld, ha a bejelentkezett felhasználónak nincs tartozása (renderBalanceBadge) -->
                        <span id="balanceBadge" title="A tartozások a lehető legkevesebb utalásra egyszerűsítve"
                              class="text-xs font-semibold bg-slate-100 text-slate-600 px-2 py-1 rounded-full whitespace-nowrap">Optimalizálva</span>
                    </div>

                    <div class="p-6 flex flex-col gap-4">
                        <!-- Személyes egyenleg-összesítő (a bejelentkezett felhasználó szemszögéből) -->
                        <div id="personalSummary" class="hidden"></div>
                        <div id="balancesList" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
                    </div>
                </section>
            </div>

            <!-- Jobb oldali oszlop: Listák -->
            <div class="lg:col-span-2 xl:col-span-1 flex flex-col gap-6 xl:gap-8 min-w-0">
                <section class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="px-6 py-5 border-b border-slate-100 bg-slate-50/50">
                        <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                            Legutóbbi kiadások
                        </h2>
                    </div>

                    <!-- Lista elemek (JS tölti fel) -->
                    <div id="recentExpensesList" class="flex flex-col divide-y divide-slate-100"></div>

                    <div class="px-6 py-4 border-t border-slate-100 bg-slate-50/50">
                        <button type="button" id="viewAllExpensesBtn" class="text-sm w-full text-center text-primary font-medium hover:text-primaryHover transition-colors">
                            Összes megtekintése &rarr;
                        </button>
                    </div>
                </section>

                <section class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="px-6 py-5 border-b border-slate-100 bg-slate-50/50">
                        <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                            <span aria-hidden="true">🔁</span> Ismétlődő kiadások
                        </h2>
                    </div>
                    <div id="recurringList" class="flex flex-col divide-y divide-slate-100"></div>
                </section>
            </div>

        </div>
    </main>

    <!-- ÖSSZES KIADÁS MODAL -->
    <div id="allExpensesModal" class="fixed inset-0 z-50 hidden overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="relative w-full max-w-4xl bg-white rounded-2xl shadow-2xl border border-slate-100 flex flex-col max-h-[90vh] overflow-hidden transition-all">

            <!-- Modal Fejléc -->
            <div class="px-4 sm:px-6 py-4 sm:py-5 border-b border-slate-100 flex items-center justify-between gap-3 bg-slate-50/50">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="w-10 h-10 flex-shrink-0 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold">
                        <svg class="w-5 h-5 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                        </svg>
                    </div>
                    <div class="min-w-0">
                        <h3 class="text-lg font-bold text-slate-800 truncate">Összes rögzített kiadás</h3>
                        <p class="text-xs text-slate-500" id="modalExpensesCount">0 tranzakció rögzítve</p>
                    </div>
                </div>
                <button type="button" id="closeModalBtn" aria-label="Bezárás" class="w-9 h-9 flex-shrink-0 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 flex items-center justify-center transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Kereső és szűrősáv + Statisztika -->
            <div class="p-4 sm:p-6 border-b border-slate-100 bg-white grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 items-center">
                <!-- Szöveges kereső -->
                <div class="relative col-span-2 md:col-span-1">
                    <input type="text" id="modalSearchInput" placeholder="Keresés tétel nevére..."
                           class="w-full pl-9 pr-4 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                    <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>

                <!-- Szűrés fizető szerint -->
                <select id="modalFilterPayer" aria-label="Szűrés fizető szerint" class="w-full min-w-0 px-2 sm:px-3 py-2 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-slate-700">
                    <option value="ALL">Minden fizető</option>
                </select>

                <!-- Szűrés kategória szerint -->
                <select id="modalFilterCategory" aria-label="Szűrés kategória szerint" class="w-full min-w-0 px-2 sm:px-3 py-2 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-slate-700">
                    <option value="ALL">Minden kategória</option>
                </select>

                <!-- Összesített összeg banner -->
                <div class="col-span-2 md:col-span-1 bg-indigo-50/60 border border-indigo-100/80 rounded-xl px-4 py-2 flex items-center justify-between gap-2">
                    <span class="text-xs font-semibold text-indigo-700 flex-shrink-0">Összesen:</span>
                    <span id="modalTotalFilteredAmount" class="text-sm font-bold text-indigo-900 text-right">0 Ft</span>
                </div>
            </div>

            <!-- Tranzakciós lista -->
            <div class="overflow-y-auto flex-1 divide-y divide-slate-100" id="modalExpensesList">
                <!-- Dinamikus sorok JS-ből -->
            </div>

            <!-- Modal Lábléc -->
            <div class="px-4 sm:px-6 py-3 sm:py-4 bg-slate-50/80 border-t border-slate-100 flex items-center justify-between gap-3">
                <!-- Csak a csoport tulajdonosának / adminnak látszik -->
                <button type="button" id="deleteAllDataBtn" title="A csoport összes kiadásának, tartozásának és rendezésének törlése"
                        class="hidden px-3 sm:px-4 py-2 text-sm font-bold text-rose-600 hover:bg-rose-50 rounded-xl transition-all whitespace-nowrap">
                    Összes adat törlése
                </button>
                <button type="button" id="closeModalFooterBtn" class="ml-auto px-5 py-2 text-sm font-bold text-slate-600 hover:text-slate-800 hover:bg-slate-200/60 rounded-xl transition-all">
                    Bezárás
                </button>
            </div>
        </div>
    </div>

<script>
    // Közös fejléc (a DOMContentLoaded előtt, hogy a téma-csúszka működjön)
    renderHeader("expenses");

    // Megosztási módok: felirat, mértékegység, csúszka-tartomány
    const SPLIT_MODES = {
        EQUAL: { label: "Egyenlő" },
        PERCENT: { label: "Százalék" },
        AMOUNT: { label: "Összeg" },
        SHARES: { label: "Részarány" }
    };
    // A százalékokat egy tizedesjegyre kerekítjük
    const PERCENT_DECIMALS = 1;

    // Globális állapottárolás
    let groupId = null;
    let group = null;          // a csoport adatai (név, szerep, canManage)
    let currentUser = null;
    let allExpensesCache = [];
    let balancesCache = [];
    let recurringCache = [];
    // Pár szerint összevont egyenlegek (adós -> hitelező, pénznemenkénti összegekkel)
    let balancePairs = [];
    // A csoport tagjai (ők lehetnek fizetők és résztvevők)
    let allUsers = [];
    let selectedParticipants = new Set();
    let selectedCategory = "EGYEB";
    // Megosztás: mód, résztvevőnkénti értékek (%, összeg vagy rész), rögzített (lakatolt) résztvevők
    let splitMode = "EQUAL";
    let splitValues = {};
    let lockedParticipants = new Set();
    // Szerkesztés alatt álló kiadás azonosítója (null = új kiadás rögzítése)
    let editingExpenseId = null;

    // ---------- 0. Csoport, tagok és jogosultságok ----------

    async function loadMembers() {
        const res = await apiFetch(groupApi(groupId, '/members'));
        allUsers = await res.json();
        selectedParticipants = new Set(allUsers);
    }

    // A tulajdonos és az admin kezeli a csoportot (fizető választása, bármely tétel módosítása)
    function canManage() {
        return group && group.canManage;
    }

    // A bejelentkezett felhasználó részt vesz-e a csoport kiadásaiban (az admin nem)
    function isParticipant() {
        return currentUser && allUsers.includes(currentUser.name);
    }

    // Saját rögzítésű kiadást módosíthat / törölhet, a tulajdonos és az admin bármelyiket
    function canModify(expense) {
        return canManage() || expense.createdBy === currentUser.name;
    }

    // A fizető: tulajdonosnál / adminnál a választott személy, mindenki másnál saját maga
    function getEffectivePayer() {
        return canManage() ? document.getElementById("payer").value : currentUser.name;
    }

    function avatarColor(name) {
        return getAvatarColor(name, allUsers);
    }

    function currentAmount() {
        const amount = parseFloat(document.getElementById("amount").value);
        return isNaN(amount) || amount <= 0 ? 0 : amount;
    }

    function currentCurrency() {
        return document.getElementById("currency").value;
    }

    // Magyar napjelölés: 1-jén, 2-án, 4-én ...
    function dayWithSuffix(day) {
        const suffixes = { 1: "jén", 2: "án", 3: "án", 4: "én", 5: "én", 6: "án", 7: "én", 8: "án", 9: "én", 10: "én",
            11: "én", 12: "én", 13: "án", 14: "én", 15: "én", 16: "án", 17: "én", 18: "án", 19: "én", 20: "án",
            21: "én", 22: "én", 23: "án", 24: "én", 25: "én", 26: "án", 27: "én", 28: "án" };
        return `${day}-${suffixes[day] || "én"}`;
    }

    // ---------- 1. Új kiadás / szerkesztés űrlap ----------

    function initFormOptions() {
        const userOptions = allUsers.map(u => `<option value="${escapeHtml(u)}">${escapeHtml(u)}</option>`).join('');

        // A fizető-választó csak a tulajdonosnak / adminnak látszik
        document.getElementById("payer").innerHTML = userOptions;
        const payerField = document.getElementById("payerField");
        payerField.classList.toggle("hidden", !canManage());
        payerField.classList.toggle("flex", canManage());
        resetPayer();

        document.getElementById("currency").innerHTML = Object.entries(CURRENCIES)
            .map(([code, info]) => `<option value="${code}">${code} (${info.symbol})</option>`).join('');

        const today = Math.min(new Date().getDate(), 28);
        document.getElementById("recurringDay").innerHTML = Array.from({ length: 28 }, (_, i) => i + 1)
            .map(d => `<option value="${d}" ${d === today ? "selected" : ""}>${dayWithSuffix(d)}</option>`).join('');

        // Modal szűrőinek feltöltése
        document.getElementById("modalFilterPayer").innerHTML = `<option value="ALL">Minden fizető</option>` + userOptions;
        document.getElementById("modalFilterCategory").innerHTML = `<option value="ALL">Minden kategória</option>` +
            Object.entries(CATEGORIES).map(([code, c]) => `<option value="${code}">${c.icon} ${c.label}</option>`).join('');
    }

    function resetPayer() {
        if (canManage()) {
            document.getElementById("payer").value = isParticipant() ? currentUser.name : (allUsers[0] ?? "");
        }
    }

    // Kategória-chipek (egyszerre egy választható)
    function renderCategoryChips() {
        document.getElementById("categoryChips").innerHTML = Object.entries(CATEGORIES).map(([code, c]) => {
            const selected = code === selectedCategory;
            const chipClass = selected
                ? "bg-indigo-100 text-indigo-600 border-transparent"
                : "bg-white text-slate-500 border-slate-200 hover:border-slate-300";
            return `
                <button type="button" data-category="${code}" role="radio" aria-checked="${selected}"
                        class="${chipClass} border rounded-full px-3 py-1.5 flex items-center gap-1.5 text-sm font-semibold transition-colors">
                    <span aria-hidden="true">${c.icon}</span>${c.label}
                </button>
            `;
        }).join('');
    }

    // Résztvevő-chipek: kik között oszlik meg a kiadás
    function renderParticipantChips() {
        document.getElementById("participantChips").innerHTML = allUsers.map(u => {
            const selected = selectedParticipants.has(u);
            const colors = avatarColor(u);
            const chipClass = selected
                ? `${colors.bg} ${colors.text} border-transparent`
                : "bg-white text-slate-400 border-slate-200 hover:border-slate-300";
            const avatarClass = selected ? "bg-white/70" : "bg-slate-100";
            return `
                <button type="button" data-user="${escapeHtml(u)}" aria-pressed="${selected}"
                        class="${chipClass} border rounded-full pl-1 pr-3 py-1 flex items-center gap-2 text-sm font-semibold transition-colors">
                    <span class="w-6 h-6 rounded-full ${avatarClass} flex items-center justify-center text-xs font-bold">${escapeHtml(u.charAt(0))}</span>
                    ${escapeHtml(u)}
                    ${selected ? '<span aria-hidden="true">✓</span>' : ''}
                </button>
            `;
        }).join('');
    }

    function getSelectedParticipants() {
        // A sorrend a tagok sorrendjét követi
        return allUsers.filter(u => selectedParticipants.has(u));
    }

    // A résztvevők vagy a mód változásakor újrarajzoljuk a megosztás teljes részét
    function refreshSplit(resetValues = true) {
        renderParticipantChips();
        if (resetValues) resetSplitValues();
        renderSplitModeButtons();
        renderSplitRows();
        updateSplitSummary();
    }

    // ---------- 2. Egyéni megosztás (százalék / összeg / részarány csúszkákkal) ----------

    function renderSplitModeButtons() {
        document.getElementById("splitModeButtons").innerHTML = Object.entries(SPLIT_MODES).map(([mode, info]) => {
            const selected = mode === splitMode;
            const cls = selected ? "bg-primary text-white shadow-sm" : "text-slate-600 hover:bg-slate-100";
            return `<button type="button" data-split-mode="${mode}" role="radio" aria-checked="${selected}"
                            class="${cls} rounded-lg px-3 py-1.5 text-sm font-semibold transition-colors">${info.label}</button>`;
        }).join('');
    }

    // Hány tizedesre kerekítünk az adott módban (százalék: 1, összeg: a pénznemé)
    function splitDecimals() {
        if (splitMode === "PERCENT") return PERCENT_DECIMALS;
        if (splitMode === "AMOUNT") return CURRENCIES[currentCurrency()].decimals;
        return 2;
    }

    // Mennyi legyen a részek összege (százaléknál 100, összegnél a kiadás összege; részaránynál nincs ilyen)
    function splitTarget() {
        if (splitMode === "PERCENT") return 100;
        if (splitMode === "AMOUNT") return currentAmount();
        return null;
    }

    // Alapértékek: egyenlő elosztás (részaránynál mindenki 1 rész)
    function resetSplitValues() {
        const participants = getSelectedParticipants();
        splitValues = {};
        lockedParticipants = new Set([...lockedParticipants].filter(p => participants.includes(p)));
        if (splitMode === "SHARES") {
            participants.forEach(p => { splitValues[p] = 1; });
        } else if (splitMode === "PERCENT" || splitMode === "AMOUNT") {
            const parts = distributeRounded(splitTarget(), participants.map(() => 1), splitDecimals());
            participants.forEach((p, i) => { splitValues[p] = parts[i]; });
        }
        lockedParticipants.clear();
    }

    function round(value, decimals) {
        const scale = Math.pow(10, decimals);
        return Math.round(value * scale) / scale;
    }

    function sumValues(participants) {
        return participants.reduce((sum, p) => sum + (Number(splitValues[p]) || 0), 0);
    }

    // Egy résztvevő értékének módosítása: százaléknál és összegnél a maradékot a többi (nem rögzített)
    // résztvevő között arányosan osztjuk szét, hogy az összeg mindig kijöjjön
    function setSplitValue(person, rawValue) {
        const decimals = splitDecimals();
        let value = Math.max(0, Number(rawValue) || 0);

        if (splitMode === "SHARES") {
            splitValues[person] = round(value, 2);
            return;
        }

        const participants = getSelectedParticipants();
        const target = splitTarget();
        const lockedSum = participants
            .filter(p => p !== person && lockedParticipants.has(p))
            .reduce((sum, p) => sum + (Number(splitValues[p]) || 0), 0);
        const adjustable = participants.filter(p => p !== person && !lockedParticipants.has(p));

        if (adjustable.length) {
            value = Math.min(value, Math.max(0, target - lockedSum));
        }
        splitValues[person] = round(value, decimals);

        if (adjustable.length) {
            const remaining = Math.max(0, target - lockedSum - splitValues[person]);
            let weights = adjustable.map(p => Number(splitValues[p]) || 0);
            if (weights.every(w => w === 0)) weights = adjustable.map(() => 1);
            const parts = distributeRounded(remaining, weights, decimals);
            adjustable.forEach((p, i) => { splitValues[p] = parts[i]; });
        }
    }

    // Összeg módban a kiadás összegének változásakor a részeket arányosan átméretezzük
    function rescaleAmountSplit() {
        if (splitMode !== "AMOUNT") return;
        const participants = getSelectedParticipants();
        let weights = participants.map(p => Number(splitValues[p]) || 0);
        if (weights.every(w => w === 0)) weights = participants.map(() => 1);
        const parts = distributeRounded(currentAmount(), weights, splitDecimals());
        participants.forEach((p, i) => { splitValues[p] = parts[i]; });
        lockedParticipants.clear();
    }

    function sliderMax() {
        if (splitMode === "PERCENT") return 100;
        if (splitMode === "AMOUNT") return currentAmount();
        return Math.max(10, ...getSelectedParticipants().map(p => Math.ceil(Number(splitValues[p]) || 0)));
    }

    function unitLabel() {
        if (splitMode === "PERCENT") return "%";
        if (splitMode === "AMOUNT") return CURRENCIES[currentCurrency()].symbol;
        return "rész";
    }

    // Résztvevőnként egy sor: avatar, név, csúszka, számmező, lakat, a rá eső összeg
    function renderSplitRows() {
        const container = document.getElementById("splitRows");
        const show = splitMode !== "EQUAL" && getSelectedParticipants().length > 0;
        container.classList.toggle("hidden", !show);
        container.classList.toggle("flex", show);
        if (!show) {
            container.innerHTML = "";
            return;
        }

        const disabled = splitMode === "AMOUNT" && currentAmount() === 0;
        const step = splitMode === "SHARES" ? 1 : Math.pow(10, -splitDecimals());
        const canLock = splitMode === "PERCENT" || splitMode === "AMOUNT";

        container.innerHTML = getSelectedParticipants().map(p => {
            const colors = avatarColor(p);
            const locked = lockedParticipants.has(p);
            // Mobilon két sor (név + számmező + lakat, alatta csúszka + összeg), nagyobb kijelzőn egy sor:
            // a két belső sor "sm:contents", így a gyerekeik egyetlen flex sorba kerülnek, az order szerint
            return `
                <div class="flex flex-col sm:flex-row sm:items-center gap-1.5 sm:gap-3" data-split-row="${escapeHtml(p)}">
                    <div class="flex items-center gap-2 sm:contents">
                        <span class="sm:order-1 w-8 h-8 flex-shrink-0 rounded-full ${colors.bg} ${colors.text} flex items-center justify-center text-sm font-bold" title="${escapeHtml(p)}">${escapeHtml(p.charAt(0))}</span>
                        <span class="sm:order-2 flex-1 sm:flex-none sm:w-20 min-w-0 text-sm font-medium text-slate-700 truncate" title="${escapeHtml(p)}">${escapeHtml(p)}</span>
                        <div class="sm:order-4 flex items-center gap-1 flex-shrink-0">
                            <input type="number" data-split-input="${escapeHtml(p)}" min="0" step="${splitMode === "SHARES" ? 0.5 : step}" ${disabled ? "disabled" : ""}
                                   aria-label="${escapeHtml(p)} része (${unitLabel()})" class="w-20 rounded-lg border border-slate-300 px-2 py-1 text-sm text-right bg-white">
                            <span class="w-7 text-xs text-slate-500">${escapeHtml(unitLabel())}</span>
                        </div>
                        ${canLock ? `<button type="button" data-split-lock="${escapeHtml(p)}" aria-pressed="${locked}"
                                title="${locked ? "Rögzítve: a többiek módosításakor nem változik" : "Rögzítés"}"
                                class="sm:order-5 w-8 h-8 flex-shrink-0 rounded-lg text-sm ${locked ? "bg-indigo-100 text-indigo-600" : "text-slate-400 hover:bg-slate-100"} transition-colors">${locked ? "🔒" : "🔓"}</button>` : ""}
                    </div>
                    <div class="flex items-center gap-3 pl-10 sm:pl-0 sm:contents">
                        <input type="range" data-split-slider="${escapeHtml(p)}" min="0" max="${sliderMax()}" step="${step}" ${disabled ? "disabled" : ""}
                               aria-label="${escapeHtml(p)} része" class="sm:order-3 flex-1 min-w-0 accent-indigo-600 disabled:opacity-40">
                        <span data-split-amount="${escapeHtml(p)}" class="sm:order-6 w-20 flex-shrink-0 text-right text-xs font-semibold text-slate-500 whitespace-nowrap"></span>
                    </div>
                </div>
            `;
        }).join('');
        updateSplitRowValues(null);
    }

    // A sorok értékeinek frissítése (a most szerkesztett számmezőt nem írjuk felül, hogy ne ugráljon a kurzor)
    function updateSplitRowValues(editingInput) {
        const amounts = currentShareAmounts();
        const currency = currentCurrency();
        getSelectedParticipants().forEach(p => {
            const row = document.querySelector(`[data-split-row="${CSS.escape(p)}"]`);
            if (!row) return;
            const value = Number(splitValues[p]) || 0;
            const slider = row.querySelector("[data-split-slider]");
            const input = row.querySelector("[data-split-input]");
            slider.max = sliderMax();
            slider.value = value;
            if (input !== editingInput) input.value = value;
            row.querySelector("[data-split-amount]").textContent = amounts[p] !== undefined && currentAmount() > 0
                ? (splitMode === "AMOUNT" ? "" : `≈ ${formatMoney(amounts[p], currency)}`)
                : "";
        });
    }

    // Résztvevőnkénti összegek (a backend számításával megegyezően)
    function currentShareAmounts() {
        return computeShareAmounts(splitMode, getSelectedParticipants(), splitValues, currentAmount(), currentCurrency());
    }

    // Hibaüzenet, ha a megosztás nem menthető; egyébként null
    function getSplitError() {
        const participants = getSelectedParticipants();
        if (participants.length === 0) {
            return "Válassz ki legalább egy résztvevőt!";
        }
        const decimals = splitDecimals();
        if (splitMode === "PERCENT") {
            const sum = sumValues(participants);
            if (Math.abs(sum - 100) > 0.01) {
                return `A százalékok összege 100% legyen (most: ${formatNumber(sum, decimals)}%)!`;
            }
        } else if (splitMode === "AMOUNT") {
            if (currentAmount() === 0) return "Előbb add meg a kiadás összegét!";
            const diff = currentAmount() - sumValues(participants);
            if (Math.abs(diff) > Math.pow(10, -decimals) / 2) {
                return diff > 0
                    ? `Még ${formatMoney(diff, currentCurrency())} nincs szétosztva!`
                    : `${formatMoney(-diff, currentCurrency())}-tal több van szétosztva, mint a kiadás összege!`;
            }
        } else if (splitMode === "SHARES") {
            if (sumValues(participants) <= 0) return "Legalább egy résztvevőnek adj pozitív részarányt!";
        }

        // Ha csak maga a fizető kap részt, nem keletkezne tartozás
        const withShare = splitMode === "EQUAL"
            ? participants
            : participants.filter(p => (Number(splitValues[p]) || 0) > 0);
        if (withShare.length > 0 && withShare.every(p => p === getEffectivePayer())) {
            return "A fizetőn kívül legalább egy résztvevőnek kell részt kapnia!";
        }
        return null;
    }

    function formatNumber(value, decimals) {
        return Number(value).toLocaleString("hu-HU", { maximumFractionDigits: decimals });
    }

    // Élő összegzés a megosztás alatt
    function updateSplitSummary() {
        const summary = document.getElementById("splitSummary");
        const error = getSplitError();
        if (error) {
            summary.textContent = error;
            summary.className = "text-xs font-medium text-rose-600";
            return;
        }

        const participants = getSelectedParticipants();
        const amount = currentAmount();
        const currency = currentCurrency();
        let text;
        if (splitMode === "EQUAL") {
            const count = participants.length;
            const label = count === allUsers.length ? `Mindenki egyenlően (${count} fő)` : `${count} fő, egyenlően`;
            text = label + (amount ? ` • ${formatMoney(amount / count, currency)} / fő` : "");
        } else if (splitMode === "PERCENT") {
            text = "Összesen: 100% ✓";
        } else if (splitMode === "AMOUNT") {
            text = `Összesen: ${formatMoney(amount, currency)} ✓`;
        } else {
            const total = sumValues(participants);
            text = `Összesen ${formatNumber(total, 2)} rész` + (amount ? ` • 1 rész = ${formatMoney(amount / total, currency)}` : "");
        }
        summary.textContent = text;
        summary.className = "text-xs font-medium text-slate-500";
    }

    function selectAllParticipants() {
        selectedParticipants = new Set(allUsers);
        refreshSplit();
    }

    // ---------- 3. Mentés ----------

    function showFormError(message) {
        const box = document.getElementById("expenseFormError");
        box.textContent = message;
        box.classList.remove("hidden");
    }

    function clearFormError() {
        document.getElementById("expenseFormError").classList.add("hidden");
    }

    // Mentés közben a gomb le van tiltva és pörgő jelet mutat (dupla küldés ellen)
    function setSaving(saving) {
        document.getElementById("submitExpenseBtn").disabled = saving;
        document.getElementById("submitExpenseIcon").classList.toggle("hidden", saving);
        document.getElementById("submitExpenseSpinner").classList.toggle("hidden", !saving);
        document.getElementById("submitExpenseLabel").textContent = saving
            ? "Mentés..."
            : (editingExpenseId ? "Módosítás mentése" : "Kiadás mentése");
    }

    function setRecurringVisible(visible) {
        document.getElementById("recurringField").classList.toggle("hidden", !visible);
        if (!visible) {
            document.getElementById("recurringCheckbox").checked = false;
            toggleRecurringOptions();
        }
    }

    function toggleRecurringOptions() {
        const checked = document.getElementById("recurringCheckbox").checked;
        const options = document.getElementById("recurringOptions");
        options.classList.toggle("hidden", !checked);
        options.classList.toggle("flex", checked);
    }

    // Űrlap visszaállítása "új kiadás" módba
    function resetExpenseForm() {
        editingExpenseId = null;
        document.getElementById("title").value = "";
        document.getElementById("amount").value = "";
        document.getElementById("currency").value = "HUF";
        resetPayer();
        selectedCategory = "EGYEB";
        renderCategoryChips();
        splitMode = "EQUAL";
        selectedParticipants = new Set(allUsers);
        document.getElementById("expenseFormTitle").textContent = "Új kiadás hozzáadása";
        document.getElementById("cancelEditBtn").classList.add("hidden");
        setRecurringVisible(true);
        clearFormError();
        setSaving(false);
        refreshSplit();
    }

    // Meglévő kiadás betöltése az űrlapba szerkesztéshez
    function startEditExpense(expense) {
        editingExpenseId = expense.id;
        document.getElementById("title").value = expense.title;
        document.getElementById("amount").value = expense.amount;
        document.getElementById("currency").value = expense.currency;
        if (canManage()) document.getElementById("payer").value = expense.payer;
        selectedCategory = expense.category;
        renderCategoryChips();

        const shares = expense.shares && expense.shares.length ? expense.shares : null;
        const people = shares ? shares.map(s => s.person) : (expense.participants || []);
        selectedParticipants = new Set(people.filter(p => allUsers.includes(p)));
        splitMode = expense.splitType || "EQUAL";
        splitValues = {};
        lockedParticipants.clear();
        if (shares && splitMode !== "EQUAL") {
            shares.forEach(s => { splitValues[s.person] = s.inputValue ?? s.amount; });
        }

        document.getElementById("expenseFormTitle").textContent = `Kiadás szerkesztése: ${expense.title}`;
        document.getElementById("cancelEditBtn").classList.remove("hidden");
        setRecurringVisible(false);
        clearFormError();
        setSaving(false);
        refreshSplit(splitMode === "EQUAL");

        document.getElementById("expenseFormSection").scrollIntoView({ behavior: "smooth", block: "start" });
        document.getElementById("title").focus({ preventScroll: true });
    }

    async function submitExpense(event) {
        event.preventDefault();
        clearFormError();

        const title = document.getElementById("title").value.trim();
        const amount = currentAmount();
        if (!title) return showFormError("Add meg a kiadás megnevezését!");
        if (!amount) return showFormError("Adj meg egy pozitív összeget!");
        const splitError = getSplitError();
        if (splitError) return showFormError(splitError);

        const isEdit = editingExpenseId !== null;
        const recurring = !isEdit && document.getElementById("recurringCheckbox").checked;
        const participants = getSelectedParticipants();
        const payload = {
            title,
            amount,
            currency: currentCurrency(),
            category: selectedCategory,
            // A backend csak a tulajdonostól / admintól fogadja el; mindenki más saját maga a fizető
            payer: getEffectivePayer(),
            participants,
            splitType: splitMode,
            splitValues: splitMode === "EQUAL" ? null : Object.fromEntries(participants.map(p => [p, Number(splitValues[p]) || 0]))
        };
        if (recurring) payload.dayOfMonth = Number(document.getElementById("recurringDay").value);

        const url = isEdit ? groupApi(groupId, `/expenses/${editingExpenseId}`)
            : groupApi(groupId, recurring ? '/recurring' : '/expenses');

        setSaving(true);
        try {
            const res = await apiJson(url, isEdit ? 'PUT' : 'POST', payload);
            if (!res.ok) {
                showFormError(await res.text());
                setSaving(false);
                return;
            }

            resetExpenseForm();
            showToast(isEdit ? `„${title}” módosítva`
                : recurring ? `„${title}” elmentve, ismétlődik minden hónap ${dayWithSuffix(payload.dayOfMonth)}`
                    : `„${title}” elmentve`);
            await loadData();
        } catch (err) {
            showFormError("Nem sikerült kapcsolódni a szerverhez. Próbáld újra!");
            setSaving(false);
        }
    }

    // ---------- 4. Adatok betöltése és megjelenítése ----------

    async function loadData() {
        try {
            const [expRes, balRes, recRes] = await Promise.all([
                apiFetch(groupApi(groupId, '/expenses')),
                apiFetch(groupApi(groupId, '/balances')),
                apiFetch(groupApi(groupId, '/recurring'))
            ]);
            allExpensesCache = await expRes.json();
            balancesCache = await balRes.json();
            recurringCache = await recRes.json();

            // Főoldalon csak a legutóbbi 5 kiadást mutatjuk
            renderRecentExpenses(allExpensesCache.slice(0, 5));
            renderBalances(balancesCache);
            renderRecurring(recurringCache);
            if (isAllExpensesModalOpen()) filterAndRenderModalExpenses();
        } catch (err) {
            console.error("Hiba az adatok lekérésekor:", err);
            showToast("Nem sikerült betölteni az adatokat.", "error");
        }
    }

    function renderRecentExpenses(expenses) {
        const listContainer = document.getElementById("recentExpensesList");

        if (expenses.length === 0) {
            listContainer.innerHTML = `<div class="p-6 text-center text-slate-400 text-sm">Még nincsenek rögzített kiadások.</div>`;
            return;
        }

        listContainer.innerHTML = expenses.map(e => {
            const colors = avatarColor(e.payer);
            const category = getCategory(e.category);
            const date = formatDate(e.createdAt);
            const recurringMark = e.recurringExpenseId ? `<span title="Havonta ismétlődő kiadás">🔁</span> ` : "";
            // A fizető és a dátum külön sorban, így a dátum sosem törik félbe
            return `
                <div class="px-6 py-4 flex items-center justify-between gap-3 hover:bg-slate-50 transition-colors">
                    <div class="flex items-center gap-4 min-w-0">
                        <div class="w-10 h-10 flex-shrink-0 rounded-full ${colors.bg} ${colors.text} flex items-center justify-center font-bold text-sm">
                            ${escapeHtml(e.payer.charAt(0))}
                        </div>
                        <div class="min-w-0">
                            <p class="text-sm font-bold text-slate-800 truncate" title="${escapeHtml(e.title)} (${escapeHtml(category.label)})">${recurringMark}${category.icon} ${escapeHtml(e.title)}</p>
                            <p class="text-xs text-slate-500 truncate">Fizette: ${escapeHtml(e.payer)}</p>
                            ${date ? `<p class="text-xs text-slate-400 whitespace-nowrap">${escapeHtml(date)}</p>` : ""}
                        </div>
                    </div>
                    <div class="text-right flex-shrink-0">
                        <p class="text-sm font-bold text-slate-800 whitespace-nowrap">${formatMoney(e.amount, e.currency)}</p>
                    </div>
                </div>
            `;
        }).join('');
    }

    // Ismétlődő kiadások listája; leállítani a létrehozó, a tulajdonos vagy az admin tudja
    function renderRecurring(rules) {
        const container = document.getElementById("recurringList");
        if (rules.length === 0) {
            container.innerHTML = `<div class="p-6 text-center text-slate-400 text-sm">Nincs ismétlődő kiadás. Új kiadásnál pipáld be a „Havonta ismétlődik” opciót!</div>`;
            return;
        }
        container.innerHTML = rules.map(r => {
            const category = getCategory(r.category);
            const canStop = canManage() || r.createdBy === currentUser.name;
            const next = new Date(`${r.nextRunDate}T00:00:00`).toLocaleDateString("hu-HU", { month: "short", day: "numeric" });
            // Az ütemezés kis címkékben, így tördeléskor sem marad félbe egy dátum
            const schedule = r.active
                ? `<span class="text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 whitespace-nowrap">havonta ${dayWithSuffix(r.dayOfMonth)}</span>
                   <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 whitespace-nowrap">következő: ${escapeHtml(next)}</span>`
                : `<span class="text-xs px-2 py-0.5 rounded-full bg-rose-50 text-rose-700" title="A fizető vagy egy résztvevő kilépett a csoportból">Leállítva</span>`;
            return `
                <div class="px-6 py-4 flex items-start justify-between gap-3">
                    <div class="min-w-0 flex flex-col gap-1">
                        <p class="text-sm font-bold text-slate-800 truncate" title="${escapeHtml(r.title)}">${category.icon} ${escapeHtml(r.title)}</p>
                        <div class="flex flex-wrap gap-1">${schedule}</div>
                        <p class="text-xs text-slate-500 truncate">Fizeti: ${escapeHtml(r.payer)}</p>
                    </div>
                    <div class="flex flex-col items-end gap-1 flex-shrink-0">
                        <p class="text-sm font-bold text-slate-800 whitespace-nowrap">${formatMoney(r.amount, r.currency)}</p>
                        ${canStop ? `<button type="button" data-stop-recurring="${r.id}" class="text-xs font-semibold text-slate-400 hover:text-rose-600 transition-colors">Leállítás</button>` : ""}
                    </div>
                </div>
            `;
        }).join('');
    }

    async function stopRecurring(rule) {
        const confirmed = await showConfirm({
            title: "Ismétlődő kiadás leállítása",
            message: `Leállítod a(z) „${rule.title}” ismétlődését? A már létrejött kiadások megmaradnak.`,
            confirmText: "Leállítás",
            danger: true
        });
        if (!confirmed) return;
        const res = await apiFetch(groupApi(groupId, `/recurring/${rule.id}`), { method: 'DELETE' });
        if (res.ok) {
            showToast(`„${rule.title}” ismétlődése leállítva`);
        } else {
            showToast(await res.text(), "error");
        }
        await loadData();
    }

    // Az egyenlegek pénznemenként érkeznek; kártyánként egy adós-hitelező párt mutatunk
    // az összes pénznemével együtt (pl. "2 500 Ft és 36 €")
    function groupBalancesByPair(balances) {
        const pairs = new Map();
        for (const b of balances) {
            const key = `${b.debtor}\u0000${b.creditor}`;
            if (!pairs.has(key)) pairs.set(key, { debtor: b.debtor, creditor: b.creditor, amounts: {} });
            pairs.get(key).amounts[b.currency] = (pairs.get(key).amounts[b.currency] || 0) + b.amount;
        }
        return [...pairs.values()];
    }

    // Személyes összesítő: mennyivel tartozik / mennyi jár a bejelentkezett felhasználónak (pénznemenként)
    function renderPersonalSummary(balances) {
        const box = document.getElementById("personalSummary");
        if (!isParticipant()) {
            box.classList.add("hidden");
            return;
        }

        const me = currentUser.name;
        const owe = {};
        const owed = {};
        for (const b of balances) {
            if (b.debtor === me) owe[b.currency] = (owe[b.currency] || 0) + b.amount;
            if (b.creditor === me) owed[b.currency] = (owed[b.currency] || 0) + b.amount;
        }
        const hasOwe = Object.keys(owe).length > 0;
        const hasOwed = Object.keys(owed).length > 0;

        let boxClass;
        const lines = [];
        if (hasOwe) lines.push(`<p class="text-xl font-bold text-orange-600">Tartozásod: ${formatMoneyMap(owe)}</p>`);
        if (hasOwed) lines.push(`<p class="text-xl font-bold text-green-700">Neked jár: ${formatMoneyMap(owed)}</p>`);

        if (hasOwe) {
            boxClass = "bg-orange-50 border-orange-100";
        } else if (hasOwed) {
            boxClass = "bg-green-50 border-green-100";
        } else {
            boxClass = "bg-slate-50 border-slate-100";
            lines.push(`<p class="text-xl font-bold text-slate-800">Nincs tartozásod, minden rendezve ✓</p>`);
        }

        const hint = hasOwed
            ? "Ha megkaptad a pénzt, a kártyán jelöld a „Megkaptam” gombbal."
            : (hasOwe ? "A tartozást a hitelező jelöli rendezettnek, amikor megkapta." : "Sem te nem tartozol, sem neked nem tartoznak.");

        box.className = `${boxClass} border rounded-xl px-5 py-4`;
        box.innerHTML = `
            <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Az egyenleged</p>
            <div class="mt-1 flex flex-col gap-0.5">${lines.join('')}</div>
            <p class="text-xs text-slate-500 mt-1">${hint}</p>
        `;
    }

    // Az "Optimalizálva" jelvény csak akkor zöld, ha a bejelentkezett felhasználónak nincs tartozása;
    // ha tartozik valakinek, narancssárga; az adminnál (nem résztvevő) semleges
    function renderBalanceBadge(balances) {
        const badge = document.getElementById("balanceBadge");
        const base = "text-xs font-semibold px-2 py-1 rounded-full whitespace-nowrap";
        if (!isParticipant()) {
            badge.className = `${base} bg-slate-100 text-slate-600`;
            badge.textContent = "Optimalizálva";
            return;
        }
        const owes = balances.some(b => b.debtor === currentUser.name);
        badge.className = `${base} ${owes ? "bg-orange-100 text-orange-600" : "bg-green-100 text-green-700"}`;
        badge.textContent = owes ? "Optimalizálva" : "Optimalizálva ✓";
        badge.title = owes
            ? "A tartozások a lehető legkevesebb utalásra egyszerűsítve – neked még van rendezendő tartozásod"
            : "A tartozások a lehető legkevesebb utalásra egyszerűsítve – neked nincs tartozásod";
    }

    function renderBalances(balances) {
        renderPersonalSummary(balances);
        renderBalanceBadge(balances);
        balancePairs = groupBalancesByPair(balances);

        const balanceContainer = document.getElementById("balancesList");
        if (balancePairs.length === 0) {
            balanceContainer.innerHTML = `<div class="col-span-full text-center text-slate-400 text-sm py-4">Mindenki elszámolt, nincsenek tartozások!</div>`;
            return;
        }

        const me = currentUser.name;
        balanceContainer.innerHTML = balancePairs.map((pair, index) => {
            let bgClass, textClass, sentence;
            if (pair.debtor === me) {
                // Én tartozom valakinek
                bgClass = "bg-orange-50 border-orange-100";
                textClass = "text-orange-600";
                sentence = `Te tartozol <span class="font-bold text-slate-800">${escapeHtml(toDative(pair.creditor))}</span>`;
            } else if (pair.creditor === me) {
                // Nekem tartozik valaki
                bgClass = "bg-green-50 border-green-100";
                textClass = "text-green-700";
                sentence = `<span class="font-bold text-slate-800">${escapeHtml(pair.debtor)}</span> tartozik neked`;
            } else {
                // Két másik személy közötti tartozás
                bgClass = "bg-slate-50 border-slate-100";
                textClass = "text-slate-700";
                sentence = `${escapeHtml(pair.debtor)} tartozik <span class="font-bold text-slate-800">${escapeHtml(toDative(pair.creditor))}</span>`;
            }

            // Rendezettnek csak a hitelező jelölheti (ő tudja, hogy megkapta), illetve a tulajdonos / admin
            let settleButton = "";
            if (pair.creditor === me || canManage()) {
                const label = pair.creditor === me ? "Megkaptam" : "Rendezve";
                settleButton = `
                    <button type="button" data-settle-index="${index}"
                            class="flex-shrink-0 text-xs font-semibold px-3 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-600 hover:text-slate-900 hover:border-slate-300 transition-colors">
                        ${label}
                    </button>`;
            }

            return `
                <div class="${bgClass} border rounded-xl p-4 flex items-center justify-between gap-3">
                    <div class="min-w-0">
                        <p class="text-sm text-slate-600 font-medium">${sentence}</p>
                        <p class="text-lg font-bold ${textClass}">${formatMoneyMap(pair.amounts)}</p>
                    </div>
                    ${settleButton}
                </div>
            `;
        }).join('');
    }

    // Tartozás kiegyenlítése egy kiválasztott pénznemben, megerősítés után
    async function settleBalance(pair) {
        const isMe = pair.creditor === currentUser.name;
        // A párnál előforduló pénznemek, rögzített sorrendben (HUF, EUR, USD, GBP)
        const currencies = Object.keys(CURRENCIES).filter(c => pair.amounts[c]);
        const multiple = currencies.length > 1;

        const currency = await showConfirm({
            title: "Tartozás rendezése",
            message: (isMe
                ? `Megerősíted, hogy megkaptad ${pair.debtor} tartozását?`
                : `Megerősíted, hogy ${pair.debtor} kifizette ${toDative(pair.creditor)} a tartozását?`)
                + (multiple ? " Válaszd ki, melyik pénznemben rendezed:" : ""),
            confirmText: isMe ? "Igen, megkaptam" : "Igen, rendezve",
            choices: currencies.map(c => ({ value: c, label: `${c}: ${formatMoney(pair.amounts[c], c)}` }))
        });
        if (!currency) return;

        const res = await apiJson(groupApi(groupId, '/settlements'), 'POST', { debtor: pair.debtor, creditor: pair.creditor, currency });
        if (res.ok) {
            showToast(`${pair.debtor} → ${pair.creditor}: ${formatMoney(pair.amounts[currency], currency)} rendezve`);
        } else {
            showToast(await res.text(), "error");
        }
        await loadData();
    }

    // ---------- 5. Összes kiadás modal: szűrés, szerkesztés, törlés ----------

    function openAllExpensesModal() {
        document.getElementById("allExpensesModal").classList.remove("hidden");
        document.body.classList.add("overflow-hidden"); // Háttérgörgetés letiltása
        filterAndRenderModalExpenses();
    }

    function closeAllExpensesModal() {
        document.getElementById("allExpensesModal").classList.add("hidden");
        document.body.classList.remove("overflow-hidden");
    }

    function isAllExpensesModalOpen() {
        return !document.getElementById("allExpensesModal").classList.contains("hidden");
    }

    // Kinek mennyi jut: egyéni megosztásnál a tárolt részekből, különben egyenlően
    function shareDescription(e) {
        const shares = e.shares && e.shares.length ? e.shares : null;
        if (!shares || e.splitType === "EQUAL") {
            const count = e.participants && e.participants.length ? e.participants.length : allUsers.length;
            const names = e.participants ? escapeHtml(e.participants.join(', ')) : 'Mindenki';
            return {
                text: `Megosztva (${count} fő): <span class="text-slate-700">${names}</span>`,
                perPerson: `${formatMoney(e.amount / count, e.currency)} / fő`
            };
        }
        const modeLabel = { PERCENT: "százalék szerint", AMOUNT: "összeg szerint", SHARES: "részarány szerint" }[e.splitType] || "";
        // Egy név és a hozzá tartozó összeg sosem kerül két sorba
        const parts = shares.map(s => `<span class="whitespace-nowrap">${escapeHtml(s.person)} ${formatMoney(s.amount, e.currency)}</span>`).join(" · ");
        return {
            text: `Megosztva (${shares.length} fő, ${modeLabel}): <span class="text-slate-700">${parts}</span>`,
            perPerson: SPLIT_MODES[e.splitType]?.label || ""
        };
    }

    function filterAndRenderModalExpenses() {
        const searchKeyword = document.getElementById("modalSearchInput").value.toLowerCase().trim();
        const selectedPayer = document.getElementById("modalFilterPayer").value;
        const selectedFilterCategory = document.getElementById("modalFilterCategory").value;

        const filtered = allExpensesCache.filter(e => {
            const matchesTitle = e.title.toLowerCase().includes(searchKeyword);
            const matchesPayer = selectedPayer === "ALL" || e.payer === selectedPayer;
            const matchesCategory = selectedFilterCategory === "ALL" || e.category === selectedFilterCategory;
            return matchesTitle && matchesPayer && matchesCategory;
        });

        // Darabszám és pénznemenként összesített összeg frissítése
        document.getElementById("modalExpensesCount").textContent = `${filtered.length} tranzakció találat (összesen: ${allExpensesCache.length})`;
        const totals = {};
        filtered.forEach(e => { totals[e.currency] = (totals[e.currency] || 0) + e.amount; });
        document.getElementById("modalTotalFilteredAmount").textContent = formatMoneyMap(totals);

        const container = document.getElementById("modalExpensesList");
        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="py-12 text-center text-slate-400">
                    <p class="text-sm">Nem található kiadás a megadott szűrési feltételekkel.</p>
                </div>
            `;
            return;
        }

        container.innerHTML = filtered.map(e => {
            const colors = avatarColor(e.payer);
            const category = getCategory(e.category);
            const share = shareDescription(e);
            const date = formatDate(e.createdAt);
            // Dátum és (ha más rögzítette, mint aki fizetett) a rögzítő, egy külön sorban
            const meta = [date, e.createdBy && e.createdBy !== e.payer ? `Rögzítette: ${e.createdBy}` : ""]
                .filter(Boolean).map(escapeHtml).join(" · ");
            const recurringMark = e.recurringExpenseId
                ? `<span class="text-xs px-2.5 py-0.5 rounded-full bg-indigo-50 font-semibold text-indigo-700 whitespace-nowrap">🔁 Ismétlődő</span>` : "";

            const actions = canModify(e) ? `
                <div class="flex items-center gap-1">
                    <button type="button" data-edit-id="${e.id}" title="Szerkesztés" aria-label="Szerkesztés: ${escapeHtml(e.title)}"
                            class="w-9 h-9 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 flex items-center justify-center transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                    </button>
                    <button type="button" data-delete-id="${e.id}" title="Törlés" aria-label="Törlés: ${escapeHtml(e.title)}"
                            class="w-9 h-9 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 flex items-center justify-center transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                    </button>
                </div>` : `<div class="w-[4.75rem]" aria-hidden="true"></div>`;

            return `
                <div class="p-4 sm:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-3 sm:gap-4 hover:bg-slate-50/70 transition-colors">
                    <div class="flex items-start gap-3 sm:gap-4 min-w-0">
                        <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl ${colors.bg} ${colors.text} flex items-center justify-center font-bold text-base flex-shrink-0 mt-0.5">
                            ${escapeHtml(e.payer.charAt(0))}
                        </div>
                        <div class="min-w-0 flex flex-col gap-1.5">
                            <h4 class="text-base font-bold text-slate-800 leading-tight break-words">${escapeHtml(e.title)}</h4>
                            <div class="flex flex-wrap items-center gap-1.5">
                                <span class="text-xs px-2.5 py-0.5 rounded-full bg-slate-100 font-semibold text-slate-600 whitespace-nowrap">${category.icon} ${escapeHtml(category.label)}</span>
                                ${recurringMark}
                                <span class="text-xs px-2.5 py-0.5 rounded-full bg-slate-100 font-semibold text-slate-600 whitespace-nowrap">
                                    Fizette: <strong class="text-slate-800">${escapeHtml(e.payer)}</strong>
                                </span>
                            </div>
                            <p class="text-xs text-slate-500">${share.text}</p>
                            ${meta ? `<p class="text-xs text-slate-400">${meta}</p>` : ""}
                        </div>
                    </div>

                    <div class="flex items-center justify-between sm:justify-end gap-4 flex-shrink-0">
                        <div class="text-left sm:text-right">
                            <p class="text-base font-bold text-slate-900 whitespace-nowrap">${formatMoney(e.amount, e.currency)}</p>
                            <p class="text-xs text-indigo-600 font-medium whitespace-nowrap">${escapeHtml(share.perPerson)}</p>
                        </div>
                        ${actions}
                    </div>
                </div>
            `;
        }).join('');
    }

    async function deleteExpense(expense) {
        const confirmed = await showConfirm({
            title: "Kiadás törlése",
            message: `Biztosan törlöd a(z) „${expense.title}” kiadást (${formatMoney(expense.amount, expense.currency)})? Ez nem visszavonható, és az egyenlegek újraszámolódnak.`,
            confirmText: "Törlés",
            danger: true
        });
        if (!confirmed) return;

        const res = await apiFetch(groupApi(groupId, `/expenses/${expense.id}`), { method: 'DELETE' });
        if (res.ok) {
            // Ha épp ezt szerkesztettük, az űrlap visszaáll új kiadás módba
            if (editingExpenseId === expense.id) resetExpenseForm();
            showToast(`„${expense.title}” törölve`);
        } else {
            showToast(await res.text(), "error");
        }
        await loadData();
    }

    // Tulajdonos / admin: a csoport minden kiadásának, tartozásának és rendezésének törlése
    async function deleteAllData() {
        const confirmed = await showConfirm({
            title: "Csoport összes adatának törlése",
            message: `Ez törli a(z) „${group.name}” csoport összes kiadását, tartozását, rendezését és ismétlődő kiadását. A tagok megmaradnak. A művelet nem visszavonható!`,
            confirmText: "Végleges törlés",
            danger: true,
            requireText: "TÖRLÉS"
        });
        if (!confirmed) return;

        const res = await apiFetch(groupApi(groupId, '/data'), { method: 'DELETE' });
        if (res.ok) {
            resetExpenseForm();
            showToast("A csoport minden kiadása és tartozása törölve");
        } else {
            showToast(await res.text(), "error");
        }
        await loadData();
    }

    // ---------- 6. Eseményfigyelők ----------

    document.addEventListener("DOMContentLoaded", async () => {
        groupId = requireGroupId();
        if (!groupId) return;
        currentUser = await loadCurrentUser();
        if (!currentUser) return;
        group = await loadGroup(groupId);
        if (!group) return;
        await loadMembers();

        initFormOptions();
        renderCategoryChips();
        refreshSplit();
        document.getElementById("deleteAllDataBtn").classList.toggle("hidden", !canManage());
        loadData();

        // Kategória választása
        document.getElementById("categoryChips").addEventListener("click", (e) => {
            const chip = e.target.closest("button[data-category]");
            if (!chip) return;
            selectedCategory = chip.dataset.category;
            renderCategoryChips();
        });

        // Résztvevő-chipek ki/bekapcsolása (a megosztás alapértékei ilyenkor újraszámolódnak)
        document.getElementById("participantChips").addEventListener("click", (e) => {
            const chip = e.target.closest("button[data-user]");
            if (!chip) return;
            const user = chip.dataset.user;
            if (selectedParticipants.has(user)) {
                selectedParticipants.delete(user);
            } else {
                selectedParticipants.add(user);
            }
            refreshSplit();
        });
        document.getElementById("selectAllParticipantsBtn").addEventListener("click", selectAllParticipants);

        // Megosztási mód váltása
        document.getElementById("splitModeButtons").addEventListener("click", (e) => {
            const btn = e.target.closest("button[data-split-mode]");
            if (!btn || btn.dataset.splitMode === splitMode) return;
            splitMode = btn.dataset.splitMode;
            refreshSplit();
        });

        // Csúszkák és számmezők: értékmódosítás, a többiek automatikus igazításával
        const splitRows = document.getElementById("splitRows");
        splitRows.addEventListener("input", (e) => {
            const person = e.target.dataset.splitSlider ?? e.target.dataset.splitInput;
            if (person === undefined) return;
            setSplitValue(person, e.target.value);
            updateSplitRowValues(e.target.dataset.splitInput !== undefined ? e.target : null);
            updateSplitSummary();
        });
        // A számmezőből kilépve a kerekített érték is megjelenik
        splitRows.addEventListener("change", (e) => {
            if (e.target.dataset.splitInput !== undefined) updateSplitRowValues(null);
        });
        splitRows.addEventListener("click", (e) => {
            const lock = e.target.closest("button[data-split-lock]");
            if (!lock) return;
            const person = lock.dataset.splitLock;
            if (lockedParticipants.has(person)) lockedParticipants.delete(person);
            else lockedParticipants.add(person);
            renderSplitRows();
        });

        // Összeg / pénznem / fizető változásakor az előnézet (és összeg módban a részek) frissül
        document.getElementById("amount").addEventListener("input", () => {
            if (splitMode === "AMOUNT") {
                rescaleAmountSplit();
                renderSplitRows();
            } else {
                updateSplitRowValues(null);
            }
            updateSplitSummary();
        });
        document.getElementById("currency").addEventListener("change", () => {
            if (splitMode === "AMOUNT") rescaleAmountSplit();
            renderSplitRows();
            updateSplitSummary();
        });
        document.getElementById("payer").addEventListener("change", updateSplitSummary);

        // Ismétlődő kiadás
        document.getElementById("recurringCheckbox").addEventListener("change", toggleRecurringOptions);
        document.getElementById("recurringList").addEventListener("click", (e) => {
            const btn = e.target.closest("button[data-stop-recurring]");
            if (!btn) return;
            const rule = recurringCache.find(r => r.id === Number(btn.dataset.stopRecurring));
            if (rule) stopRecurring(rule);
        });

        // Mentés (Enter is működik) és szerkesztés megszakítása
        document.getElementById("expenseForm").addEventListener("submit", submitExpense);
        document.getElementById("cancelEditBtn").addEventListener("click", resetExpenseForm);

        // Megkaptam / Rendezve gombok az egyenleg-kártyákon
        document.getElementById("balancesList").addEventListener("click", (e) => {
            const btn = e.target.closest("button[data-settle-index]");
            if (btn) settleBalance(balancePairs[Number(btn.dataset.settleIndex)]);
        });

        // "Összes megtekintése" gomb
        document.getElementById("viewAllExpensesBtn").addEventListener("click", openAllExpensesModal);

        // Szerkesztés és törlés a modalban
        document.getElementById("modalExpensesList").addEventListener("click", (e) => {
            const editBtn = e.target.closest("button[data-edit-id]");
            const deleteBtn = e.target.closest("button[data-delete-id]");
            if (editBtn) {
                const expense = allExpensesCache.find(x => x.id === Number(editBtn.dataset.editId));
                if (expense) {
                    closeAllExpensesModal();
                    startEditExpense(expense);
                }
            } else if (deleteBtn) {
                const expense = allExpensesCache.find(x => x.id === Number(deleteBtn.dataset.deleteId));
                if (expense) deleteExpense(expense);
            }
        });

        // Tulajdonos / admin: a csoport összes adatának törlése
        document.getElementById("deleteAllDataBtn").addEventListener("click", deleteAllData);

        // Modal bezáró gombok
        document.getElementById("closeModalBtn").addEventListener("click", closeAllExpensesModal);
        document.getElementById("closeModalFooterBtn").addEventListener("click", closeAllExpensesModal);

        // Modal bezárása háttérkattintásra
        document.getElementById("allExpensesModal").addEventListener("click", (e) => {
            if (e.target.id === "allExpensesModal") closeAllExpensesModal();
        });

        // ESC: a kiadás-lista bezárása (a megerősítő ablakot a common.js zárja be előbb)
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closeAllExpensesModal();
        });

        // Szűrő és kereső bemenetek figyelése
        document.getElementById("modalSearchInput").addEventListener("input", filterAndRenderModalExpenses);
        document.getElementById("modalFilterPayer").addEventListener("change", filterAndRenderModalExpenses);
        document.getElementById("modalFilterCategory").addEventListener("change", filterAndRenderModalExpenses);
    });
</script>
</body>
