spring.application.name=KozosKassza

# Helyi titkos beállítások (jelszó) betöltése
spring.config.import=optional:classpath:application-local.properties

# Neon PostgreSQL adatbázis
spring.datasource.url=jdbc:postgresql://ep-late-bread-bhnlec46.c-10.eu-central-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require
spring.datasource.username=neondb_owner
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate séma automatikus frissítése
spring.jpa.hibernate.ddl-auto=update

# Bejelentkezés érvényessége a belépéstől számítva
kozoskassza.session.max-duration=15m
server.servlet.session.timeout=15m

# Bemutató adatok betöltése induláskor, ha még üres az adatbázis
kozoskassza.demo-data.enabled=true

server.port=${PORT:8080}