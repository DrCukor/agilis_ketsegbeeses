spring.application.name=KozosKassza
# H2 adatbázis fájlba mentve a projekt gyökerében lévő /data mappába
spring.datasource.url=jdbc:h2:file:./data/kozoskassza_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 böngészős konzol engedélyezése teszteléshez (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate séma automatikus frissítése
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true